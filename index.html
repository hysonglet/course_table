<script>
    const xhr = new XMLHttpRequest();

    // 刷新按钮的点击事件
    function onRefresh() {
        const input = document.getElementById('input').value;
        console.log(input);

        let url = 'http://localhost:8080/proxy/class_course?class_name=' + input;

        xhr.open('GET', url);
        xhr.onreadystatechange = function () {
            console.log('readyState: ' + xhr.readyState + ' status: ' + xhr.status);
            if (xhr.readyState === 4 && xhr.status === 200) {
                console.log(xhr);
                const tbody = document.getElementById('content');
                var courses = JSON.parse(xhr.responseText);
                var append_text = '';

                const week = document.getElementById('week');
                const nowWeek = week.value;

                // 过滤当前周的课表
                let currentWeek = courses.filter((course) => {
                    if (course.week_start <= nowWeek && course.week_end >= nowWeek) {
                        if (course.week_type == "both") {
                            return true;
                        }
                        else if (course.week_type == "single" && nowWeek % 2 == 1) {
                            return true;
                        }
                        else if (course.week_type == "double" && nowWeek % 2 == 0) {
                            return true;
                        }
                        else {
                            return false
                        }
                    }

                    return false;
                })

                currentWeek.forEach(element => {
                    console.log("element: ", element);
                });

                currentWeek.forEach(element => {
                    const id = String(element.week) + "-" + String(element.class_start);

                    const container = document.getElementById(id);
                    let htmlContext = "";
                    htmlContext += '<p>' + element.object + '</p>';
                    htmlContext += '<p>' + element.teacher + '</p>';
                    htmlContext += '<p>' + element.address + '</p>';

                    var color = "rgb(" + Math.floor(Math.random() * 255) + "," + Math.floor(Math.random() * 255) + "," + Math.floor(Math.random() * 255) + ")";

                    container.style.backgroundColor = color;

                    container.innerHTML = htmlContext;
                })
            }
            else {
                if (xhr.status !== 200 || xhr.status !== 0) {
                    // alert('访问数据失败');
                }
                console.log('访问数据失败', this);
            }
        };
        xhr.send();
    }
</script>
